<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSB Digital Document Center</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --gemini-blue: #1A73E8;
            --gemini-purple: #8A2BE2;
            --gemini-pink: #FF007F;
            --gemini-cyan: #00FFFF;
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.3);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            overflow: hidden; 
            background-color: #000;
        }

        /* =========================================
           MAIN DASHBOARD SYSTEM
        ========================================= */
        #main-system {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            display: flex;
            opacity: 1;
            visibility: visible;
            background-image: url('Plant MSB.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        #main-system::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(26, 115, 232, 0.15) 0%, rgba(138, 43, 226, 0.15) 100%);
            pointer-events: none;
            z-index: 0;
        }

        /* SIDEBAR KIRI */
        .sidebar {
            width: 320px;
            height: 100vh;
            background: rgba(10, 15, 30, 0.6);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-right: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            padding: 30px 20px;
            z-index: 10;
            box-shadow: 5px 0 20px rgba(0,0,0,0.3);
            overflow-y: auto;
        }

        .sidebar::-webkit-scrollbar {
            width: 6px;
        }
        .sidebar::-webkit-scrollbar-thumb {
            background: var(--gemini-cyan);
            border-radius: 10px;
        }

        .sidebar-header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 25px;
            border-bottom: 1px solid rgba(255,255,255,0.15);
        }

        .sidebar-header img {
            width: 200px;
            background: rgba(255, 255, 255, 0.9);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: transform 0.3s ease;
        }
        
        .sidebar-header img:hover {
            transform: scale(1.03);
        }

        .sidebar-header h2 {
            color: #f8f9fa;
            font-size: 1rem;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 5px;
        }

        /* Tombol Navigasi */
        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            text-decoration: none;
            color: #e0e0e0;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid transparent;
            position: relative;
            overflow: hidden;
        }

        .nav-item i {
            font-size: 1.2rem;
            width: 30px;
            margin-right: 15px;
            color: var(--gemini-cyan);
            transition: all 0.3s ease;
        }

        .nav-item:hover, .nav-item.active {
            background: rgba(255,255,255,0.15);
            border-color: var(--gemini-cyan);
            color: #fff;
            transform: translateX(5px);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
        }

        .nav-item:hover i, .nav-item.active i {
            color: var(--gemini-pink);
            transform: scale(1.2);
        }

        .nav-item::before {
            content: '';
            position: absolute;
            left: 0; top: 0;
            height: 100%; width: 4px;
            background: linear-gradient(to bottom, var(--gemini-cyan), var(--gemini-purple));
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .nav-item:hover::before, .nav-item.active::before {
            opacity: 1;
        }

        /* KONTEN UTAMA */
        .main-content {
            flex: 1;
            height: 100vh;
            padding: 20px;
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
        }

        .top-bar {
            background: rgba(10, 15, 30, 0.4);
            backdrop-filter: blur(10px);
            padding: 15px 30px;
            border-radius: 15px;
            border: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            box-shadow: var(--glass-shadow);
        }

        .top-bar h1 {
            color: #fff;
            font-size: 1.5rem;
            font-weight: 600;
        }

        .top-bar .time {
            color: var(--gemini-cyan);
            font-weight: 500;
            letter-spacing: 1px;
        }

        .iframe-container {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(5px);
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.2);
            overflow: hidden;
            position: relative;
            box-shadow: 0 0 30px rgba(0,0,0,0.2);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .welcome-message {
            position: absolute;
            text-align: center;
            color: #fff;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .welcome-message h2 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            font-weight: 600;
        }
        .welcome-message p {
            font-size: 1.1rem;
            color: #ddd;
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 15px;
            position: relative;
            z-index: 2;
            opacity: 0;
            transition: opacity 0.5s ease;
            background: #fff;
        }
    </style>
</head>
<body>

    <div id="main-system">
        
        <aside class="sidebar">
            <div class="sidebar-header">
                <img src="MSB Logo.png" alt="MSB Logo">
                <h2>Administration System</h2>
            </div>
            
            <nav class="nav-menu">
                <a href="https://docs.google.com/document/d/1bV8J84DPY8n1P4yFK44lUmOkatdAmcPMySlFePPUmWE/edit?tab=t.0" target="systemFrame" class="nav-item" onclick="setActive(this)">
                    <i class="fas fa-file-signature"></i> KOP Surat
                </a>
                <a href="https://murindasentrabaja.github.io/Memo-MSB/" target="systemFrame" class="nav-item" onclick="setActive(this)">
                    <i class="fas fa-envelope-open-text"></i> Digital Memo
                </a>
                <a href="https://murindasentrabaja.github.io/Minutes-Of-Meeting-MOM-/" target="systemFrame" class="nav-item" onclick="setActive(this)">
                    <i class="fas fa-users-viewfinder"></i> Minutes Of Meeting
                </a>

                <a href="https://murindasentrabaja.github.io/Form-Gudang/" target="systemFrame" class="nav-item" onclick="setActive(this)">
                    <i class="fas fa-boxes-stacked"></i> Permintaan Gudang
                </a>
                <a href="https://murindasentrabaja.github.io/Form-Perbaikan-Mesin/" target="systemFrame" class="nav-item" onclick="setActive(this)">
                    <i class="fas fa-screwdriver-wrench"></i> Perbaikan Mesin
                </a>
                <a href="https://murindasentrabaja.github.io/Label-Komponen/" target="systemFrame" class="nav-item" onclick="setActive(this)">
                    <i class="fas fa-tags"></i> Label Komponen
                </a>
                <a href="https://murindasentrabaja.github.io/Product-Label/" target="systemFrame" class="nav-item" onclick="setActive(this)">
                    <i class="fas fa-barcode"></i> Product Label
                </a>

                <a href="https://murindasentrabaja.github.io/Logistics/" target="systemFrame" class="nav-item" onclick="setActive(this)">
                    <i class="fas fa-truck-fast"></i> Delivery Order
                </a>
                <a href="https://murindasentrabaja.github.io/Surat-Jalan/" target="systemFrame" class="nav-item" onclick="setActive(this)">
                    <i class="fas fa-route"></i> Surat Jalan
                </a>

                <a href="https://murindasentrabaja.github.io/Surat-Perintah-Lembur-MSB/" target="systemFrame" class="nav-item" onclick="setActive(this)">
                    <i class="fas fa-user-clock"></i> Surat Perintah Lembur
                </a>

                <!-- Link Baru: Parking System -->
                <a href="https://murindasentrabaja.github.io/Parking-System/" target="systemFrame" class="nav-item" onclick="setActive(this)">
                    <i class="fas fa-square-parking"></i> Parking System
                </a>
            </nav>
        </aside>

        <main class="main-content">
            <div class="top-bar">
                <h1 id="page-title">Dashboard</h1>
                <div class="time" id="clock">00:00:00</div>
            </div>

            <div class="iframe-container">
                <div class="welcome-message" id="welcome-msg">
                    <h2>Selamat Datang</h2>
                    <p>Silakan pilih menu di samping untuk membuka dokumen digital.</p>
                </div>
                
                <iframe name="systemFrame" id="systemFrame" onload="frameLoaded()"></iframe>
            </div>
        </main>

    </div>

    <script>
        function setActive(element) {
            let items = document.querySelectorAll('.nav-item');
            items.forEach(item => item.classList.remove('active'));
            
            element.classList.add('active');
            document.getElementById('page-title').innerText = element.innerText;

            document.getElementById('welcome-msg').style.opacity = '0';
            document.getElementById('systemFrame').style.opacity = '1';
        }

        function frameLoaded() {
            let frame = document.getElementById('systemFrame');
            if(frame.src && frame.src !== window.location.href) {
                frame.style.opacity = '1';
            }
        }

        setInterval(() => {
            const timeElement = document.getElementById('clock');
            const now = new Date();
            timeElement.innerText = now.toLocaleTimeString('id-ID', { hour12: false }) + ' WIB';
        }, 1000);
    </script>
</body>
</html>
